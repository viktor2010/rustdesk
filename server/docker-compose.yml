# Eigener RustDesk-Server (kostenlose Open-Source-Version) für Homeco.
# Auf dem VPS: Ordner anlegen, diese Datei hineinlegen, `docker compose up -d`.
# Der öffentliche Schlüssel liegt danach in ./data/id_ed25519.pub
# (Inhalt = GitHub-Secret HOMECO_KEY).
#
# Firewall freigeben: TCP 21115-21117, UDP 21116
# (21118/21119 nur für den Web-Client, hier nicht nötig)

services:
  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    volumes:
      - ./data:/root
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: host
    restart: unless-stopped
