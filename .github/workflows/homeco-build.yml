# Baut den Homeco-Fernwartungs-Client für Windows (x64).
# Abgeleitet vom Windows-Job aus flutter-build.yml (RustDesk 1.5.0), ergänzt
# um den Branding-Schritt (homeco/branding.py). Ohne Signatur-Dienst,
# Druckertreiber und virtuelle Bildschirme – für Kunden-Fernwartung unnötig.
# Ergebnis: portable Homeco-Fernwartung.exe (Kunden-Download) und
# Homeco-Fernwartung-<Version>.msi (Installation über den WAREXA-Agenten).
#
# Start: GitHub → Actions → „Homeco Fernwartung bauen“ → „Run workflow“.
# Ergebnis: Release mit Homeco-Fernwartung.exe, dauerhaft erreichbar unter
# https://github.com/<konto>/<repo>/releases/latest/download/Homeco-Fernwartung.exe
#
# Variante „techniker“: Homeco-Techniker.exe/.msi zum Verbinden (nur ausgehend).
# Wird als Vorabversion veröffentlicht, damit „latest“ beim Kunden-Client bleibt.

name: Homeco Fernwartung bauen

on:
  workflow_dispatch:
    inputs:
      variante:
        description: "kunde = Homeco-Fernwartung (nur eingehend), techniker = Homeco-Techniker (zum Verbinden)"
        type: choice
        options: [kunde, techniker]
        default: kunde

permissions:
  contents: write

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.0"
  APP_NAME: ${{ inputs.variante == 'techniker' && 'Homeco-Techniker' || 'Homeco-Fernwartung' }}

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-windows:
    needs: [generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Homeco-Branding anwenden
        env:
          HOMECO_SERVER: ${{ secrets.HOMECO_SERVER }}
          HOMECO_KEY: ${{ secrets.HOMECO_KEY }}
          HOMECO_VARIANT: ${{ inputs.variante }}
          PYTHONUTF8: "1"
        run: |
          pip3 install pillow
          python3 homeco/branding.py

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: homeco-windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; done
            exit 1
          fi

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          # Der Prozess muss <App-Name>.exe heißen (siehe libs/portable/src/bin_reader.rs)
          mv ./rustdesk/rustdesk.exe "./rustdesk/${{ env.APP_NAME }}.exe"

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" != "" ]; then cp $runner_res ./libs/portable/Runner.res; fi

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${{ env.APP_NAME }}.exe"
          popd
          mkdir -p ./out
          mv ./target/release/rustdesk-portable-packer.exe "./out/${{ env.APP_NAME }}.exe"
          sha256sum ./out/*.exe

      # MSI für die Installation über den WAREXA-Agenten (Dienst, unbeaufsichtigter Zugriff).
      # preprocess.py benennt Produkt, Dienst und Ordner nach --app-name.
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build msi
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk --app-name "${{ env.APP_NAME }}" -m "HomeCo Computersysteme"
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          popd
          mv $msi.FullName "./out/${{ env.APP_NAME }}-${{ env.VERSION }}.msi"
          Get-FileHash ./out/*.msi -Algorithm SHA256

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APP_NAME }}
          path: ./out

      - name: Publish Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ inputs.variante == 'techniker' && 'homeco-techniker' || 'homeco' }}-${{ env.VERSION }}-${{ github.run_number }}
          name: ${{ env.APP_NAME }} ${{ env.VERSION }} (Build ${{ github.run_number }})
          prerelease: ${{ inputs.variante == 'techniker' }}
          files: |
            ./out/*.exe
            ./out/*.msi
